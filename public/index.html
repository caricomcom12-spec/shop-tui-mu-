<script>
let currentUser = null;
const oPhanThuongCount = 4;
let dangQuay = false;

function handleGmailLogin() {
    const emailInput = document.getElementById('gmail-input');

    if (!emailInput) return;

    const email = emailInput.value.trim();

    if (!email || !email.includes('@')) {
        alert("Vui lòng điền đúng địa chỉ Gmail!");
        return;
    }

    fetch('/api/auth/gmail-login', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            email: email
        })
    })
    .then(res => res.json())
    .then(data => {
        if (data.success) {
            currentUser = data.user;
            renderUserPanel();
            capNhatLichSuGiaoDich();
        } else {
            alert(data.msg || "Đăng nhập thất bại!");
        }
    })
    .catch(error => {
        console.error(error);
        alert("Không thể kết nối đến máy chủ!");
    });
}

function renderUserPanel() {
    if (!currentUser) return;

    const authPanel = document.getElementById('auth-panel');

    authPanel.innerHTML = `
        <div class="profile">
            <div style="display:flex; align-items:center; gap:10px;">
                <img 
                    src="${currentUser.avatar || ''}" 
                    alt="Avatar"
                    style="width:45px; height:45px; object-fit:cover; border-radius:50%; border:2px solid var(--cb-pink);"
                >

                <div style="max-width:180px;">
                    <div style="font-weight:bold; font-size:13px; word-break:break-all;">
                        ${currentUser.email}
                    </div>

                    <div class="uid-tag">
                        Mã số (UID): ${currentUser.uid}
                    </div>
                </div>
            </div>

            <div style="text-align:right;">
                <div class="money">
                    ${(Number(currentUser.balance) || 0).toLocaleString('vi-VN')}đ
                </div>

                <button 
                    class="btn-add-money" 
                    onclick="showNapTienBox()"
                >
                    Nạp tiền
                </button>
            </div>
        </div>
    `;

    const historyContainer = document.getElementById('history-container');

    if (historyContainer) {
        historyContainer.style.display = "block";
    }
}

function capNhatLichSuGiaoDich() {
    const area = document.getElementById('history-list-area');

    if (!area) return;

    if (
        !currentUser ||
        !Array.isArray(currentUser.history) ||
        currentUser.history.length === 0
    ) {
        area.innerHTML = `
            <div style="color:#8892b0; text-align:center; padding:10px;">
                Chưa có lịch sử bốc thăm/quay số nào.
            </div>
        `;
        return;
    }

    let htmlStr = "";

    currentUser.history.forEach(item => {
        htmlStr += `
            <div class="history-item">
                <div>
                    ⏱️ ${item.thoiGian || ''} -
                    <b>${item.tenSp || 'Vòng quay'}</b>
                </div>

                <div class="history-result">
                    ➔ ${item.ketQua || ''}
                </div>
            </div>
        `;
    });

    area.innerHTML = htmlStr;
}

function showNapTienBox() {
    if (!currentUser) {
        alert("Bạn chưa đăng nhập!");
        return;
    }

    const popupContent = document.getElementById('popupContent');
    const popupModal = document.getElementById('popupModal');

    if (!popupContent || !popupModal) return;

    popupContent.innerHTML = `
        <h3>💳 HƯỚNG DẪN NẠP TIỀN QUA ZALO</h3>

        <p style="margin-top:10px;">
            Mã số UID của bạn là:
            <strong style="color:var(--cb-pink); font-size:18px;">
                ${currentUser.uid}
            </strong>
        </p>

        <div style="
            font-size:24px;
            font-weight:bold;
            color:#39ff14;
            margin:15px 0;
            text-shadow:0 0 5px #39ff14;
        ">
            📞 Zalo: 0907859891
        </div>

        <p style="
            font-size:13px;
            color:#fff;
            line-height:1.5;
        ">
            Số dư không đủ vui lòng liên hệ sđt 0907859891,
            bank tiền + UID:
            <strong>${currentUser.uid}</strong>
            để được cộng tiền vào tài khoản.
        </p>

        <button
            class="btn-close"
            style="margin-top:15px;"
            onclick="closeModal()"
        >
            ĐÃ HIỂU
        </button>
    `;

    popupModal.style.display = "flex";
}

function spinWheel() {
    if (!currentUser) {
        alert("Bạn cần đăng nhập bằng Gmail ở phía trên trước!");
        return;
    }

    if (dangQuay) return;

    dangQuay = true;

    fetch('/api/shop/quay-vong-quay', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            email: currentUser.email
        })
    })
    .then(res => res.json())
    .then(data => {
        const content = document.getElementById('popupContent');
        const popupModal = document.getElementById('popupModal');

        if (!content || !popupModal) {
            dangQuay = false;
            return;
        }

        if (!data.success) {
            dangQuay = false;

            content.innerHTML = `
                <h3>❌ SỐ DƯ KHÔNG ĐỦ</h3>

                <p style="
                    font-size:14px;
                    padding:15px 0;
                    line-height:1.6;
                    color:#fff;
                    text-align:left;
                ">
                    ${data.msg || 'Số dư của bạn không đủ để thực hiện vòng quay.'}
                </p>

                <button
                    class="btn-close"
                    style="background:#ff4757;"
                    onclick="closeModal()"
                >
                    ĐÓNG
                </button>
            `;

            popupModal.style.display = "flex";
            return;
        }

        if (!data.reward) {
            dangQuay = false;

            content.innerHTML = `
                <h3>❌ LỖI KẾT QUẢ</h3>
                <p>Máy chủ không trả về phần thưởng.</p>

                <button
                    class="btn-close"
                    onclick="closeModal()"
                >
                    ĐÓNG
                </button>
            `;

            popupModal.style.display = "flex";
            return;
        }

        const targetIdx = Number(data.reward.index) || 0;

        const degreesPerSegment = 360 / oPhanThuongCount;

        const targetDegrees =
            360 -
            (targetIdx * degreesPerSegment) -
            (degreesPerSegment / 2);

        const totalRotation =
            (360 * 5) + targetDegrees;

        const wheelEl = document.getElementById('wheel');

        if (!wheelEl) {
            dangQuay = false;
            return;
        }

        wheelEl.style.transition =
            'transform 4s cubic-bezier(0.1, 0.8, 0.1, 1)';

        wheelEl.style.transform =
            `rotate(${totalRotation}deg)`;

        setTimeout(() => {
            dangQuay = false;

            currentUser.balance = data.newBalance;
            currentUser.history = data.history;

            renderUserPanel();
            capNhatLichSuGiaoDich();

            /*
             * Đưa vòng quay về góc cuối cùng nhưng không
             * tạo animation ngược.
             */
            wheelEl.style.transition = 'none';
            wheelEl.style.transform =
                `rotate(${targetDegrees}deg)`;

            setTimeout(() => {
                wheelEl.style.transition =
                    'transform 4s cubic-bezier(0.1, 0.8, 0.1, 1)';
            }, 50);

            if (data.reward.loai === 'acc') {

                content.innerHTML = `
                    <h3>🎉 CHÚC MỪNG BẠN! 🎉</h3>

                    <p style="margin-top:5px;">
                        Bạn đã quay trúng:
                        <b style="color:var(--cb-blue);">
                            ${data.reward.ten || ''}
                        </b>
                    </p>

                    <div class="acc-info-box">

                        <p>
                            🔐 <b>Tài khoản:</b>
                            <span style="
                                color:var(--cb-blue);
                                font-weight:bold;
                            ">
                                ${data.reward.tk || ''}
                            </span>
                        </p>

                        <p>
                            🔑 <b>Mật khẩu:</b>
                            <span style="
                                color:var(--cb-blue);
                                font-weight:bold;
                            ">
                                ${data.reward.mk || ''}
                            </span>
                        </p>

                        <p style="
                            font-size:12px;
                            color:#aaa;
                            margin-top:8px;
                        ">
                            ✨ <b>Mô tả:</b>
                            <i>${data.reward.note || ''}</i>
                        </p>

                    </div>

                    <button
                        class="btn-close"
                        style="background:#39ff14; color:#000;"
                        onclick="closeModal()"
                    >
                        NHẬN QUÀ
                    </button>
                `;

            } else {

                content.innerHTML = `
                    <h3 style="color:var(--cb-pink);">
                        🎁 KẾT QUẢ VÒNG QUAY
                    </h3>

                    <p style="
                        font-size:15px;
                        font-weight:bold;
                        padding:20px 0;
                        color:#fff;
                    ">
                        ${data.reward.msg || 'Bạn đã nhận được phần thưởng.'}
                    </p>

                    <button
                        class="btn-close"
                        style="background:var(--cb-pink);"
                        onclick="closeModal()"
                    >
                        ĐÓNG
                    </button>
                `;
            }

            popupModal.style.display = "flex";

        }, 4000);
    })
    .catch(error => {
        console.error(error);

        dangQuay = false;

        const content = document.getElementById('popupContent');
        const popupModal = document.getElementById('popupModal');

        if (content && popupModal) {
            content.innerHTML = `
                <h3>❌ LỖI KẾT NỐI</h3>

                <p style="
                    color:#fff;
                    padding:15px 0;
                    line-height:1.5;
                ">
                    Không thể kết nối đến máy chủ.
                    Vui lòng thử lại sau.
                </p>

                <button
                    class="btn-close"
                    onclick="closeModal()"
                >
                    ĐÓNG
                </button>
            `;

            popupModal.style.display = "flex";
        }
    });
}

function closeModal() {
    const popupModal = document.getElementById('popupModal');

    if (popupModal) {
        popupModal.style.display = "none";
    }
}
</script>
